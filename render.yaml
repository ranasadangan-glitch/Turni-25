# Render Blueprint for TurniDSP Platform.
# Deploys a Node web service (Root Directory = server) + a managed PostgreSQL.
# Render's PostgreSQL requires SSL — the app enables it automatically when
# DATABASE_URL is present (see server/src/db/pool.js).
services:
  - type: web
    name: turnidsp-platform
    runtime: node
    rootDir: server
    plan: starter
    buildCommand: npm ci
    # Migrations run once per deploy in the pre-deploy phase (advisory-locked,
    # SSL-aware), while the previous version keeps serving — zero-downtime for
    # normal deploys.
    preDeployCommand: npm run migrate
    # `npm start` = migrate && serve. The boot-time migrate is a belt-and-braces
    # guarantee that the schema exists before the server accepts traffic: Render
    # SKIPS preDeployCommand on a service's FIRST deploy, which otherwise brings
    # the app up against an empty database (relation "role_permissions"/"users"
    # does not exist -> RBAC warning + login 503). Migrations are idempotent and
    # advisory-locked, so on a normal deploy this second run is a fast no-op
    # (preDeploy already migrated) and concurrent boots are safe.
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: turnidsp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL
        value: 12h
      - key: PG_POOL_MAX
        value: "20"
      # PGSSL is intentionally not set: SSL turns on automatically with DATABASE_URL.
      # Set PGSSL=false only if you ever use a non-TLS database.
      - key: FORCE_HTTPS
        value: "true"
        # Render's edge always terminates TLS and reliably sets
        # X-Forwarded-Proto, so it's safe (and expected) to force HTTPS here.
        # This is NOT the default anymore — a VPS deployment must opt in only
        # once its own reverse proxy is confirmed to forward that header.

databases:
  - name: turnidsp-db
    plan: starter
    databaseName: turnidsp
    user: turnidsp
